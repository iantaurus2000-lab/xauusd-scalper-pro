name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.2 || true
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        id: find
        run: |
          find app/build/outputs -name "*.apk" -type f || true
          APK=$(find app/build/outputs -name "*.apk" -type f | head -n 1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK" || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalper-Pro-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
