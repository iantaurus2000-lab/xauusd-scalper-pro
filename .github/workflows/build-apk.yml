name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Android SDK path
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Ubuntu runner provides Android SDK
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR"
            # Fallback: use cmdline tools from known path if present
            if [ -d /usr/local/lib/android/sdk ]; then
              SDK_DIR=/usr/local/lib/android/sdk
            fi
          fi
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "Using SDK: $SDK_DIR"
          ls -la "$SDK_DIR" || true
          # Accept licenses if sdkmanager exists
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          elif [ -x "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalper-Pro-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
