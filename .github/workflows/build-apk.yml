name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "SDK=$SDK_DIR"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          yes | "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" --licenses 2>/dev/null || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalper-Pro-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
